name: 📋 Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: 🔍 Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎨 Check code style
        run: npm run lint
        continue-on-error: true

      - name: 📐 Check code complexity
        run: |
          echo "Analisando complexidade do código..."
          find cypress/support -name "*.js" -type f | wc -l
          echo "Arquivos JavaScript encontrados"

      - name: 📝 Generate report
        run: |
          echo "# Code Quality Report" > code-quality-report.md
          echo "" >> code-quality-report.md
          echo "## Linting" >> code-quality-report.md
          npm run lint >> code-quality-report.md 2>&1 || true
          echo "" >> code-quality-report.md
          echo "## Test Files" >> code-quality-report.md
          find cypress -name "*.feature" -type f | wc -l >> code-quality-report.md

      - name: 💾 Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: code-quality-report.md
          retention-days: 30

  dependency-check:
    name: 🔐 Security Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 🔐 Dependency audit
        run: npm audit --audit-level=moderate || true

      - name: 📋 Generate dependencies list
        run: npm list > dependencies.txt

      - name: 💾 Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-list
          path: dependencies.txt
          retention-days: 30
