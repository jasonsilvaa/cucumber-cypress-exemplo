name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📝 Get changelog entry
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Criando release para versão: $VERSION"

      - name: 🏷️ Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Confira o arquivo [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref }}/CHANGELOG.md) para detalhes desta versão.
          draft: false
          prerelease: false

      - name: 📊 Generate release notes
        run: |
          echo "# Release ${{ steps.changelog.outputs.version }}" > release-notes.md
          echo "" >> release-notes.md
          echo "Released on: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release-notes.md
          echo "" >> release-notes.md
          echo "## What's New" >> release-notes.md
          echo "" >> release-notes.md
          echo "See [CHANGELOG.md](./CHANGELOG.md) for details." >> release-notes.md

      - name: 💾 Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30
