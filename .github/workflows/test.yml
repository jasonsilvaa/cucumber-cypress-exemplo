name: 🧪 Cypress Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Executar diariamente às 8 da manhã UTC
    - cron: '0 8 * * *'

jobs:
  test:
    name: 🎯 Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
        browser: [chrome, firefox, edge]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run linting
        run: npm run lint

      - name: 🧪 Run Cypress tests (${{ matrix.browser }})
        run: npm test -- --browser ${{ matrix.browser }}
        continue-on-error: true

      - name: 📸 Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.node-version }}-${{ matrix.browser }}
          path: cypress/screenshots
          retention-days: 7

      - name: 🎥 Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.node-version }}-${{ matrix.browser }}
          path: cypress/videos
          retention-days: 7

  lint-and-format:
    name: 📝 Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: ✅ Check linting
        run: npm run lint
        continue-on-error: true

  result:
    name: 📊 Test Results Summary
    runs-on: ubuntu-latest
    needs: [test, lint-and-format]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Check if tests passed
        if: needs.test.result != 'failure' && needs.lint-and-format.result != 'failure'
        run: |
          echo "✅ All tests passed!"
          exit 0

      - name: ❌ Tests failed
        if: needs.test.result == 'failure' || needs.lint-and-format.result == 'failure'
        run: |
          echo "❌ Some tests or lint checks failed"
          exit 1
