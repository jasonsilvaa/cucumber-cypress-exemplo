name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Confira o [CHANGELOG.md](./CHANGELOG.md) para detalhes desta versão.

      - name: 📊 Generate release notes artifact
        run: |
          echo "# Release ${GITHUB_REF_NAME}" > release-notes.md
          echo "" >> release-notes.md
          echo "Released on: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release-notes.md

      - name: 💾 Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30
